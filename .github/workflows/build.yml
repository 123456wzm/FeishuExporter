name: Build Feishu Exporter EXE

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build EXE
        working-directory: build
        run: python -m PyInstaller FeishuExporter.spec --clean --noconfirm

      - name: Verify EXE
        run: |
          if (Test-Path "build\dist\FeishuExporter.exe") {
            Write-Host "EXE built successfully"
            Get-Item "build\dist\FeishuExporter.exe" | Select-Object Length
          } else {
            Write-Error "EXE not found"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FeishuExporter-Windows
          path: build/dist/FeishuExporter.exe
          if-no-files-found: error

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/FeishuExporter.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
